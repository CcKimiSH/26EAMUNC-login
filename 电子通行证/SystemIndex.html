<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026卓越学院模拟联合国大会 - 电子通行证</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- 【第一层：登录页面】保持简洁、功能导向 -->
    <div id="login-page" class="card">
        <h2>MUN 身份验证</h2>
        <div class="input-group">
            <label for="input-name">代表姓名</label>
            <input type="text" id="input-name" placeholder="请输入代表姓名">
        </div>
        <div class="input-group">
            <label for="input-qq">验证码/ID</label>
            <input type="text" id="input-qq" placeholder="请输入QQ号进行验证">
        </div>
        <button onclick="handleLogin()" class="btn-login">立即进入</button>
    </div>

    <!-- 【第二层：生成式设计通行证】成功登录后通过 JS 切换显示 -->
    <!-- 找到 #pass-page 部分，替换为以下结构 -->
<div id="pass-page" class="card pass-container hidden">
    <!-- 装饰层：左侧粗色块 -->
    <div class="decor-left-bar"></div>
    <!-- 装饰层：顶部粗色块 -->
    <div class="decor-top-bar"></div>
    <!-- 装饰层：左上角交汇处点缀 -->
    <div class="decor-corner-accent"></div>
    <!-- 装饰层：右下角1/4圆 -->
    <div class="decor-bottom-circle"></div>

    <!-- 内容层：确保文字在所有装饰之上 -->
    <div class="content-layer">
        <header>
            <!-- 品牌占位符号 -->
            <h1 class="brand-logo">SCO</h1>
        </header>

        <!-- 视觉中轴线 -->
        <div class="divider-wrapper">
            <hr class="horizontal-rule">
        </div>

        <!-- 信息展示区 -->
        <section class="info-group">
            <div class="info-item">
                <span class="info-label">【姓名】</span>
                <span id="display-name" class="info-value break-word">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">【会场】</span>
                <span id="display-venue" class="info-value break-word">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">【席位】</span>
                <span id="display-seat" class="info-value break-word">-</span>
            </div>
        </section>

        <footer class="date-footer">
            2026.08.11 — 2026.08.13
        </footer>
    </div>
</div>

<script>
    // 核心加密逻辑：SHA-256 哈希计算
    async function hashValue(message) {
        const msgBuffer = new TextEncoder().encode(message);                    
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        const nameInput = document.getElementById('input-name').value.trim();
        const qqInput = document.getElementById('input-qq').value.trim();

        if (!nameInput || !qqInput) {
            alert("请填写完整信息");
            return;
        }

        try {
            // 1. 获取脱敏后的 JSON 数据 (必须确保文件名与你的 crypto_data.json 一致)
            const response = await fetch('crypto_data.json');
            if (!response.ok) throw new Error("无法读取数据库");
            const data = await response.json();

            // 2. 将输入的 QQ 号转换为哈希值进行比对
            const inputHash = await hashValue(qqInput);

            // 3. 在数据库中寻找匹配的姓名和哈希值
            const user = data.find(item => item.name === nameInput && item.qq_hash === inputHash);

            if (user) {
                // 切换视图：隐藏登录，显示通行证
                document.getElementById('login-page').classList.add('hidden');
                const passPage = document.getElementById('pass-page');
                passPage.classList.remove('hidden');

                // 【关键】应用基于 JSON 的动态配色方案
                passPage.className = `card pass-container ${user.bg_class}`;

                // 填充数据
                document.getElementById('display-name').innerText = user.name;
                document.getElementById('display-venue').innerText = user.venue;
                document.getElementById('display-seat').innerText = user.seat;

            } else {
                alert("身份验证失败：姓名或ID不正确");
            }

        } catch (error) {
            console.error(error);
            alert("系统错误，请检查网络或尝试在本地服务器环境下打开");
        }
    }

    // 支持回车键快捷登录
    document.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
</script>

</body>
</html>
