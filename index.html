<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子通行证 - 登录入口</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #f2f2f2; font-family: 'Segoe UI', sans-serif;
        }
        .login-box {
            background: #fff; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 340px;
        }
        .login-box h2 { text-align: center; margin-bottom: 25px; color: #333; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: bold; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 12px;
            font-size: 15px; outline: none; transition: border 0.3s;
            background-color: #fff;
        }
        .input-group input:focus, .input-group select:focus { border-color: #7ac2b8; }
        .btn-login {
            width: 100%; padding: 14px; background-color: #7ac2b8; color: white; border: none;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background-color: #62a89d; }
        .hidden { display: none; }
        #error-msg { color: #d32f2f; text-align: center; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>卓越学院 MUN 验证</h2>
    <div class="input-group">
        <label for="input-name">代表姓名</label>
        <input type="text" id="input-name" placeholder="请输入您的姓名">
    </div>
    <div class="input-group">
        <label for="input-qq">验证 ID (QQ号)</label>
        <input type="text" id="input-qq" placeholder="请输入您的 QQ 号">
    </div>
    <!-- 新增：会场选择 -->
    <div class="input-group">
        <label for="input-venue">所属会场</label>
        <select id="input-venue">
            <option value="">请选择您的会场</option>
            <option value="UNSC">UNSC - 联合国安全理事会</option>
            <option value="SCO">SCO - 上海合作组织</option>
            <option value="NAC">NAC - 北大西洋理事会</option>
            <option value="MPC">MPC - 主新闻中心</option>
            <option value="USCC">USCC - Continental Congress</option>
            <option value="IPC">IPC - 推演与情报中心</option>
            <option value="EFZMUN">EFZMUN - 二附中模联社</option>
        </select>
    </div>
    <button onclick="handleLogin()" class="btn-login">验证身份并进入</button>
    <div id="error-msg"></div>
</div>

<script>
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        const name = document.getElementById('input-name').value.trim();
        const qq = document.getElementById('input-qq').value.trim();
        const venue = document.getElementById('input-venue').value.trim();
        const errorEl = document.getElementById('error-msg');
        errorEl.style.display = 'none';

        if (!name || !qq || !venue) {
            errorEl.innerText = "请完整填写姓名、ID 并选择您的会场";
            errorEl.style.display = 'block';
            return;
        }

        try {
            // 1. 请求加密的数据库
            const response = await fetch('crypto_data.json');
            if (!response.ok) throw new Error("数据库加载失败，请确保运行在 Live Server 下");
            const data = await response.json();

            // 2. 计算输入QQ的SHA-256哈希值
            const inputHash = await sha256(qq);

            // 3. 【多重确认】匹配姓名 + 哈希 + 所属会场
            const user = data.find(item => 
                item.name === name && 
                item.qq_hash === inputHash && 
                item.venue === venue
            );

            if (user) {
                // 4. 成功！将用户数据写入本地缓存，并跳转到通行证展示页
                localStorage.setItem('pass_user', JSON.stringify(user));
                window.location.href = 'pass.html';
            } else {
                errorEl.innerText = "验证失败：姓名、ID 或所属会场错误";
                errorEl.style.display = 'block';
            }
        } catch (error) {
            console.error(error);
            errorEl.innerText = "系统错误，请检查控制台或网络";
            errorEl.style.display = 'block';
        }
    }

    // 回车快捷键
    document.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
