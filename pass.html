<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子通行证</title>
    <!-- 思源黑体 (Noto Sans SC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 颜色变量 ===== */
        :root {
            --color-a: #7ac2b8;
            --color-b: #ccaacb;
            --color-d: #ffffff;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }

        /* 六套配色 */
        [data-theme="sco"] {
            --color-a: #7ac2b8;
            --color-b: #ccaacb;
            --color-d: #ffffff;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }
        [data-theme="unsc"] {
            --color-a: #5A85AE;
            --color-b: #B4BFEF;
            --color-d: #FFFFFF;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }
        [data-theme="nac"] {
            --color-a: #1f1f9a;
            --color-b: #E5B09A;
            --color-d: #FFFFFF;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }
        [data-theme="mpc"] {
            --color-a: #67434F;
            --color-b: #CCB198;
            --color-d: #FFFFFF;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }
        [data-theme="uscc"] {
            --color-a: #224676;
            --color-b: #DA2D2B;
            --color-d: #FFFFFF;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }
        [data-theme="ipc"] {
            --color-a: #EFE5D2;
            --color-b: #D9D0C0;
            --color-d: #162C46;
            --color-c: color-mix(in srgb, #FFFFFF 55%, var(--color-a));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Noto Sans SC", "Roboto", sans-serif;
            padding: 12px;
        }

        /* ===== 屏幕自适应容器 ===== */
        .screen-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 12px;
        }

        /* ===== 卡片（物理尺寸 70mm × 100mm） ===== */
        .card {
            position: relative;
            width: 70mm;
            height: 100mm;
            background-color: var(--color-d);
            border-radius: 3mm;
            box-shadow: 0 2mm 5mm rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: background-color 0.4s ease;
            /* 屏幕自适应缩放，保持物理尺寸在视口中可见 */
            transform: scale(calc(min(1, (100vw - 30px) / 70mm)));
            transform-origin: center center;
            flex-shrink: 0;
        }

        /* ===== 内部元素全部使用 mm 单位 ===== */

        /* ---- 顶部条 & 左侧条 (颜色A) ---- */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 7.5mm;
            background-color: var(--color-a);
            z-index: 1;
            transition: background-color 0.4s ease;
        }
        .left-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 7.5mm;
            height: 100%;
            background-color: var(--color-a);
            z-index: 1;
            transition: background-color 0.4s ease;
        }

        /* ---- 左上 & 右下角块 (颜色B) + 灰环 ---- */
        .corner-block,
        .badge-block {
            position: absolute;
            width: 12mm;
            height: 12mm;
            background-color: var(--color-b);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.4s ease;
        }
        .corner-block {
            top: 0;
            left: 0;
            border-radius: 0 0 50% 0;
        }
        .badge-block {
            bottom: 0;
            right: 0;
            border-radius: 50% 0 0 0;
        }
        .gray-ring {
            width: 5.5mm;
            height: 5.5mm;
            border: 1mm solid var(--color-c);
            border-radius: 50%;
            background: transparent;
            z-index: 3;
            transition: border-color 0.4s ease;
        }

        /* ---- 左侧竖排文字 ---- */
        .left-text-eamunc {
            position: absolute;
            left: 3mm;
            top: 14mm;
            width: 7.5mm;
            color: var(--color-d);
            font-size: 4mm;
            font-weight: 800;
            letter-spacing: 2mm;
            writing-mode: vertical-lr;
            text-align: center;
            z-index: 3;
            transition: color 0.4s ease;
            font-family: "Noto Sans SC", "Roboto", sans-serif;
            line-height: 1.2;
            transform: scaleX(1.8); 
            transform-origin: center;
            user-select: none;
        }

        /* ---- 左侧装饰条纹 (颜色B) ---- */
        .left-stripe-deco {
            position: absolute;
            left: 0;
            width: 7.5mm;
            height: 3.5mm;
            background-color: var(--color-b);
            z-index: 10;
            transition: background-color 0.4s ease;
        }
        .stripe-1 {
            top: 60%;
        }
        .stripe-2 {
            top: calc(60% + 7mm);
        }
        .stripe-3 {
            top: calc(60% + 14mm);
        }

        /* ---- 主标题 (venue) ---- */
        .text-group {
            position: absolute;
            left: 15mm;
            top: 16mm;
            font-size: 10mm;
            font-weight: 700;
            letter-spacing: 0.5mm;
            line-height: 1;
            z-index: 2;
            color: var(--color-b);
            transition: color 0.4s ease;
            font-family: "Noto Sans SC", "Roboto", sans-serif;
            text-transform: uppercase;
        }

        /* ---- 横线 ---- */
        .line-thick {
            position: absolute;
            left: 15mm;
            right: 8mm;
            top: 27.5mm;
            height: 1.2mm;
            background-color: var(--color-a);
            border-radius: 0.6mm;
            z-index: 2;
            transition: background-color 0.4s ease;
        }
        .line-thin {
            position: absolute;
            left: 15mm;
            right: 8mm;
            top: 29.5mm;
            height: 0.5mm;
            background-color: var(--color-a);
            border-radius: 0.25mm;
            z-index: 2;
            transition: background-color 0.4s ease;
        }

        /* ---- 信息展示区 ---- */
        .placeholders {
            position: absolute;
            left: 15mm;
            top: 34mm;
            display: flex;
            flex-direction: column;
            gap: 3mm;
            z-index: 2;
            max-width: calc(100% - 20mm );
        }
        .placeholders span {
            font-size: 4mm;
            color: var(--color-a);
            font-weight: 600;
            letter-spacing: 0.2mm;
            display: block;
            transition: color 0.4s ease;
            line-height: 1.3;
        }
        /* 姓名行*/
        .placeholders .name-row {
            font-size: 10mm;
            font-weight: 800;
            letter-spacing: 0.4mm;

        }
        /* 会议信息行*/
        .placeholders .info-conference {
            font-size: 2mm;
            font-weight: 400;
            letter-spacing: 0.1mm;
            line-height: 1.0;
        }

        /* ---- 底部 Logo ---- */
        .logo-wrapper {
            position: absolute;
            left: 15mm;
            bottom: 3.5mm;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 55mm;
            z-index: 2;
        }
        .card-logo {
            width: 120%;
            height: 7mm;
            object-fit: contain;
            display: block;
            color: var(--color-c);
            transition: color 0.4s ease;
        }

        /* ---- 右侧圆形占位符 (颜色C) ---- */
        .circle-placeholder {
            position: absolute;
            width: 20mm;
            height: 20mm;
            border-radius: 50%;
            background-color: var(--color-c);
            z-index: 5;
            top: 75%;
            /* 右侧1/3溢出：半径5mm，溢出1/3即约1.67mm，圆心X = 宽度 - 半径/3 = 70 - 5/3 ≈ 68.33mm */
            left: 90%;
            transform: translate(-50%, -50%);
            transition: background-color 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-d);
            font-size: 3.5mm;
            font-weight: 300;
            opacity: 0.7;
            pointer-events: none;
        }
        .circle-placeholder::after {
            content: "✦";
            font-size: 9mm;
            color: var(--color-d);
            opacity: 0.5;
        }

        /* ===== 打印样式 ===== */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                display: block !important;
            }
            .screen-wrapper {
                padding: 0 !important;
                min-height: auto !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 100% !important;
                height: 100vh !important;
            }
            .card {
                transform: none !important;
                box-shadow: none !important;
                border-radius: 1.5mm !important;
                width: 70mm !important;
                height: 100mm !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            .circle-placeholder {
                opacity: 0.6;
            }
            .circle-placeholder::after {
                opacity: 0.3;
            }
        }

        /* ===== 极窄屏适配 ===== */
        @media screen and (max-width: 300px) {
            .card {
                transform: scale(0.78);
            }
        }
        @media screen and (max-width: 240px) {
            .card {
                transform: scale(0.6);
            }
        }

        /* ===== 调试信息（打印时隐藏） ===== */
        .debug-info {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            color: #999;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 10px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            z-index: 999;
            pointer-events: none;
            font-family: monospace;
        }
        @media print {
            .debug-info {
                display: none !important;
            }
        }
    </style>
</head>

    <script>
        // ===== 会场中文映射 =====
        const venueMap = {
            'SCO': '上海合作组织',
            'NAC': '北大西洋理事会',
            'USCC': 'Continental Congress',
            'MPC': '主新闻中心',
            'UNSC': '联合国安全理事会',
            'IPC': '推演与情报中心'
        };

        // ===== 设置主题配色 =====
        function setTheme(themeName) {
            const container = document.getElementById('app-container');
            container.setAttribute('data-theme', themeName.toLowerCase());
        }

        // ===== 页面加载 =====
        window.onload = function() {
            // 1. 检查登录态
            const userStr = localStorage.getItem('pass_user');
            if (!userStr) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);

            // 2. 切换主题
            const theme = user.venue.toLowerCase();
            setTheme(theme);

            // 3. 填充信息
            const venueUpper = user.venue.toUpperCase();
            document.getElementById('theme-text').textContent = venueUpper;

            const venueCN = user.venueCN || venueMap[user.venue] || user.venue;
            document.getElementById('info-venuecn').innerText = venueCN;
            document.getElementById('info-seat').innerText = user.seat || '';
            document.getElementById('info-name').innerText = user.name || '';
            document.getElementById('info-school').innerText = user.school || '';
            document.getElementById('info-conference1').innerText = "2026卓越学院模拟联合国大会" || '';
            document.getElementById('info-conference2').innerText = "8.11 ~ 8.13 " || '';
            // 4. 动态修改页面标题：会场 + 姓名 + 席位 info-conference
            const titleParts = [];
            if (venueCN) titleParts.push(venueCN);
            if (user.name) titleParts.push(user.name);
            if (user.seat) titleParts.push(user.seat);
            document.title = titleParts.join(' · ') || '电子通行证';

            // 5. 占位符兜底（若数据为空）
            const nameEl = document.getElementById('info-name');
            if (!user.name || user.name.trim() === '') {
                nameEl.innerText = '______';
            }
            const schoolEl = document.getElementById('info-school');
            if (!user.school || user.school.trim() === '') {
                schoolEl.innerText = '______';
            }
            const seatEl = document.getElementById('info-seat');
            if (!user.seat || user.seat.trim() === '') {
                seatEl.innerText = '______';
            }

            // 调试信息
            const debug = document.getElementById('debugInfo');
            if (debug) {
                debug.textContent = `${venueCN} · ${user.name || '____'}`;
            }
        };
    </script>
